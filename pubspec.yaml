name: pharma
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.11.1

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.1.0

  # Dependency Injection
  get_it: ^9.2.1

  # Secure Storage
  flutter_secure_storage: ^11.0.0

  # UI / Utilities
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.0
  intl: ^0.20.3

  # Stripe Payment
  flutter_stripe: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
